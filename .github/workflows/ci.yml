          PY

      - name: 验证已合并剧不重建目录、不重复下载
        run: |
          docker exec hgxz-ci python - <<'PY'
          import subprocess, pathlib
          from HGXZ.state import StateDB
          from HGXZ.core import Album
          from HGXZ.cli import Archiver
          import HGXZ.cli as C
          root = pathlib.Path('/tmp/nodup/AI成人短剧')
          m = root/'不重下剧 (全2集)'; m.mkdir(parents=True, exist_ok=True)
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','lavfi','-i','testsrc=size=160x120:rate=10:duration=1','-f','lavfi','-i','sine=frequency=400:duration=1','-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p','-c:a','aac','-shortest',str(m/'不重下剧 (全2集).mp4')], check=True)
          movie = m/'不重下剧 (全2集).mp4'
          db = StateDB(pathlib.Path('/tmp/nodup/s.sqlite3'))
          db.upsert_album(1,'AI成人短剧','不重下剧',2,True,str(root/'不重下剧 [huangguo-1]'))
          db.mark_merge(1, str(movie), 2, 1000)
          # 故意把 episodes.path 指向不存在的旧分集（模拟旧代码合并后的状态）
          for n in (1,2):
              db.mark_episode(1,n,str(root/'不重下剧 [huangguo-1]'/'Season 01'/f'不重下剧.S01E0{n}.mp4'),'done')
          assert all(db.episode_done(1,n) for n in (1,2)), 'episode_done 兜底未生效'
          assert not db.episode_done(1,3), '超出合并范围应为 False'
          db.close()
          cfg = {'site':{'base_url':'http://127.0.0.1:1','categories':[{'name':'AI成人短剧','path':'/ai-duanju/','library':'AI成人短剧'}]},
                 'download':{'root':'/tmp/nodup','minimum_duration':1},
                 'merge':{'enabled':True,'delete_episodes':True,'only_when_complete':False},
                 'state':{'database':'/tmp/nodup/s.sqlite3'},'log':{'directory':''}}
          a = Archiver(cfg)
          class FakeClient:
              def get_text(self, p): return '<html></html>'
          a.client = FakeClient()
          C.parse_detail_html = lambda aid, cat, html: Album(id=1, category=cat, title='不重下剧', plot='', year=2025, tags=[], episode_count=2, ended=True, cover_url=None)
          r = a.sync_album(1, cfg['site']['categories'][0])
          assert r.get('reason') == 'already-merged', f'未跳过已合并: {r}'
          assert not (root/'不重下剧 [huangguo-1]').exists(), 'TV 目录被重建了'
          print('OK 已合并剧跳过同步且未重建 TV 目录')
          a.state.close()
          PY

      - name: 验证 DAEMON=1 时子命令不被 daemon 抢走
        run: |
          docker exec hgxz-ci python - <<'PY'
          import os, subprocess, pathlib
          # 容器里 DAEMON=1，子命令必须优先，不能去绑 7731/7732
          env = dict(os.environ, DAEMON='1')
          r = subprocess.run(['python','-m','HGXZ.cli','--cleanup-merged','--cleanup-dry-run'],
                             capture_output=True, text=True, env=env, timeout=120)
          out = (r.stdout or '') + (r.stderr or '')
          assert 'address already in use' not in out, f'子命令仍在抢端口: {out[-500:]}'
          assert r.returncode == 0, f'子命令失败 rc={r.returncode}: {out[-500:]}'
          assert 'removed' in out, f'未输出清理结果: {out[-500:]}'
          print('OK DAEMON=1 下 --cleanup-merged 正常执行')
          PY

      - name: 验证增量合并遗留的多集数文件夹被清理
        run: |
          docker exec hgxz-ci python - <<'PY'
          import subprocess, pathlib
          from HGXZ.state import StateDB
          from HGXZ.merge_existing import cleanup_merged, merge_library
          lib = pathlib.Path('/tmp/dupf/短剧')
          # 同一部剧三个集数的电影文件夹
          for n in (1,2,3):
              d = lib/f'多版本剧 (全{n}集)'; d.mkdir(parents=True, exist_ok=True)
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','lavfi','-i','testsrc=size=160x120:rate=10:duration=1','-f','lavfi','-i','sine=frequency=400:duration=1','-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p','-c:a','aac','-shortest',str(d/f'多版本剧 (全{n}集).mp4')], check=True)
          st = StateDB(pathlib.Path('/tmp/dupf/s.sqlite3'))
          st.upsert_album(5,'AI成人短剧','多版本剧',3,True,str(lib/'多版本剧 [huangguo-5]'))
          st.mark_merge(5,str(lib/'多版本剧 (全2集)/多版本剧 (全2集).mp4'),2,100)
          r = cleanup_merged(pathlib.Path('/tmp/dupf'), st)
          assert r['removed_duplicates'] == 2, f'应删2个: {r}'
          left = sorted(d.name for d in lib.iterdir() if d.is_dir())
          assert left == ['多版本剧 (全3集)'], f'应只留全3集: {left}'
          print('OK 只保留最大集数:', left)

          # merge_library：旧 (全2集) + 新 3 集分集 -> 只留 (全3集)
          lib2 = pathlib.Path('/tmp/dupf2/短剧')
          old = lib2/'增量剧 (全2集)'; old.mkdir(parents=True, exist_ok=True)
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','lavfi','-i','testsrc=size=160x120:rate=10:duration=1','-f','lavfi','-i','sine=frequency=400:duration=1','-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p','-c:a','aac','-shortest',str(old/'增量剧 (全2集).mp4')], check=True)
          src = lib2/'增量剧 [huangguo-6]'/'Season 01'; src.mkdir(parents=True, exist_ok=True)
          for i in (1,2,3):
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','lavfi','-i','testsrc=size=160x120:rate=10:duration=1','-f','lavfi','-i','sine=frequency=400:duration=1','-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p','-c:a','aac','-shortest',str(src/f'增量剧.S01E0{i}.mp4')], check=True)
          merge_library(pathlib.Path('/tmp/dupf2'), delete_episodes=True)
          left2 = sorted(d.name for d in lib2.iterdir() if d.is_dir())
          assert left2 == ['增量剧 (全3集)'], f'旧文件夹未清理: {left2}'
          print('OK 合并后旧文件夹已清理:', left2)
          st.close()
          PY

      - name: 验证合并集数修复与残缺分集不覆盖完整电影
        run: |
          docker exec hgxz-ci python - <<'PY'
          import subprocess, pathlib
          from HGXZ.state import StateDB
          from HGXZ.merge_existing import (merge_library, repair_merge_counts,
                                           find_existing_movie, episode_count_from_name)
          lib = pathlib.Path('/tmp/cnt/短剧')
          mov = lib/'计数剧 (全5集)'; mov.mkdir(parents=True, exist_ok=True)
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','lavfi','-i','testsrc=size=160x120:rate=10:duration=5','-f','lavfi','-i','sine=frequency=400:duration=5','-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p','-c:a','aac','-shortest',str(mov/'计数剧 (全5集).mp4')], check=True)
          good = (mov/'计数剧 (全5集).mp4').stat().st_size

          st = StateDB(pathlib.Path('/tmp/cnt/s.sqlite3'))
          st.upsert_album(11,'AI成人短剧','计数剧',5,True,str(lib/'计数剧 [huangguo-11]'))
          # 模拟旧 bug：回填写入 merged_episodes=0
          st.mark_merge(11, str(mov/'计数剧 (全5集).mp4'), 0, good)
          assert not any(st.episode_done(11,n) for n in range(1,6)), '0 值应判为未下载'
          repair_merge_counts(st)
          assert st.merge_row(11)['merged_episodes'] == 5, st.merge_row(11)
          assert all(st.episode_done(11,n) for n in range(1,6)), '修复后应全部已下载'

          # 残留 2 集：不得把 (全5集) 替换成 (全2集)
          src = lib/'计数剧 [huangguo-11]'/'Season 01'; src.mkdir(parents=True, exist_ok=True)
          for i in (1,2):
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','lavfi','-i','testsrc=size=160x120:rate=10:duration=1','-f','lavfi','-i','sine=frequency=400:duration=1','-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p','-c:a','aac','-shortest',str(src/f'计数剧.S01E0{i}.mp4')], check=True)
          found = find_existing_movie(lib, '计数剧')
          assert found and episode_count_from_name(found.stem) == 5, f'未找到完整电影: {found}'
          merge_library(pathlib.Path('/tmp/cnt'), delete_episodes=True, state=st)
          kept = lib/'计数剧 (全5集)'/'计数剧 (全5集).mp4'
          assert kept.is_file(), '(全5集) 被删除了'
          assert kept.stat().st_size == good, '完整电影被残缺文件覆盖'
          left = sorted(d.name for d in lib.iterdir() if d.is_dir())
          assert left == ['计数剧 (全5集)'], f'应只剩一个文件夹: {left}'
          assert st.merge_row(11)['merged_episodes'] == 5, st.merge_row(11)
          print('OK 集数修复且完整电影未被残缺分集覆盖')
          st.close()
          PY

      - name: 验证合并后已下载容量不丢失
        run: |
          docker exec hgxz-ci python - <<'PY'
          import subprocess, pathlib
          from HGXZ.state import StateDB
          from HGXZ.merge_existing import merge_library, repair_merge_counts
          lib = pathlib.Path('/tmp/sizec/短剧')
          src = lib/'容量剧 [huangguo-21]'/'Season 01'; src.mkdir(parents=True, exist_ok=True)
          total_before = 0
          for i in (1,2,3):
              f = src/f'容量剧.S01E0{i}.mp4'
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','lavfi','-i','testsrc=size=160x120:rate=10:duration=2','-f','lavfi','-i','sine=frequency=400:duration=2','-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p','-c:a','aac','-shortest',str(f)], check=True)
              total_before += f.stat().st_size
          st = StateDB(pathlib.Path('/tmp/sizec/s.sqlite3'))
          st.upsert_album(21,'AI成人短剧','容量剧',3,True,str(lib/'容量剧 [huangguo-21]'))
          for i in (1,2,3):
              st.mark_episode(21,i,str(src/f'容量剧.S01E0{i}.mp4'),'done',(src/f'容量剧.S01E0{i}.mp4').stat().st_size)
          assert st.dashboard_stats()['downloaded_bytes'] == total_before
          merge_library(pathlib.Path('/tmp/sizec'), delete_episodes=True, state=st)
          movie = lib/'容量剧 (全3集)'/'容量剧 (全3集).mp4'
          assert movie.is_file(), '未生成合并文件'
          real = movie.stat().st_size
          got = st.dashboard_stats()['downloaded_bytes']
          assert got == real, f'容量不符: 统计 {got} vs 实际 {real}'
          assert got > 0, '容量塌成 0'
          assert st.episode_stats(21)['downloaded_bytes'] == real, '单剧容量不符'
          assert st.merge_row(21)['size_bytes'] == real, 'merges.size_bytes 未记录'

          # 历史脏数据（size_bytes=0）也能被修好
          st.mark_merge(21, str(movie), 3, 0)
          repair_merge_counts(st)
          assert st.merge_row(21)['size_bytes'] == real, '历史 size 未修复'
          print('OK 合并后容量保持', real, 'bytes')
          st.close()
          PY

      - name: 验证容器日志无异常
        run: |
          docker logs hgxz-ci 2>&1 | tee /tmp/ci.log
          grep -qiE 'traceback|error|critical' /tmp/ci.log && {
            echo "日志中出现异常"; exit 1; }
          echo "✓ 日志干净"

      - name: 清理
        if: always()
        run: docker rm -f hgxz-ci || true

  # ---------------------------------------------------------------- 发布镜像
  publish:
    name: 推送 GHCR 镜像
    runs-on: ubuntu-latest
    needs: smoke
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 清理旧的无标签版本
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: 'huangguo-down'
          package-type: 'container'
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 3
