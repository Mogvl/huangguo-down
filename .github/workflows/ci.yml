name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR 仓库名必须小写；github.repository 的大小写不保证
  IMAGE: ghcr.io/mogvl/huangguo-down

jobs:
  # ---------------------------------------------------------------- 静态校验
  lint:
    name: 语法与配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Python 语法检查
        run: |
          python -m compileall -q HGXZ
          echo "✓ 所有 Python 文件语法通过"

      - name: Shell 脚本检查
        run: |
          sh -n docker/entrypoint.sh
          bash -n deploy.sh
          echo "✓ Shell 脚本语法通过"

      - name: 校验 docker-compose.yml
        run: |
          docker compose config >/dev/null
          echo "✓ docker-compose.yml 语法通过"

      - name: 校验 config.example.json
        run: |
          python -c "import json;json.load(open('config.example.json'));print('✓ config.example.json 是合法 JSON')"

      - name: 校验前端引用的元素 id 都存在
        run: |
          python - <<'PY'
          import re, sys
          html = open('HGXZ/web/static/index.html', encoding='utf-8').read()
          ids = set(re.findall(r'id="([^"]+)"', html))
          used = set(re.findall(r"getElementById\('([^']+)'\)", html))
          missing = sorted(used - ids)
          if missing:
              print('缺失的元素 id:', missing)
              sys.exit(1)
          print(f'✓ {len(used)} 个 getElementById 引用全部存在')
          PY

  # ---------------------------------------------------------------- 启动冒烟
  smoke:
    name: 容器启动冒烟测试
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t hgxz:ci .

      - name: 启动容器
        run: |
          docker run -d --name hgxz-ci \
            -p 7731:7731 -p 7732:7732 \
            -e HGXZ_SYNC_ON_START=0 \
            -e TZ=Asia/Shanghai \
            -e UMASK=000 \
            hgxz:ci
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:7731/healthz >/dev/null 2>&1; then
              echo "✓ 前端在 ${i}s 后就绪"; break
            fi
            sleep 1
            [ "$i" = 30 ] && { echo "前端未在 30s 内就绪"; docker logs hgxz-ci; exit 1; }
          done

      - name: 验证前端端口
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7731/)
          [ "$code" = "200" ] || { echo "前端返回 $code"; exit 1; }
          echo "✓ 7731 返回 200"

      - name: 验证后端端口
        run: |
          body=$(curl -fsS http://127.0.0.1:7732/healthz)
          echo "$body" | grep -q '"status":"ok"' || { echo "后端响应异常: $body"; exit 1; }
          echo "✓ 7732 /healthz 正常：$body"

      - name: 验证后端不带页面
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7732/)
          [ "$code" = "404" ] || { echo "后端 / 返回 $code，预期 404"; exit 1; }
          echo "✓ 7732 不提供页面（404）"

      - name: 验证 API 可用
        run: |
          curl -fsS http://127.0.0.1:7732/api/dashboard | grep -q '"albums"' || exit 1
          echo "✓ /api/dashboard 正常"

      - name: 验证合并功能可用
        run: |
          docker exec hgxz-ci python - <<'PY'
          import sys; sys.path.insert(0, '/app')
          from HGXZ.cli import Archiver
          cfg = {'site': {'base_url': 'http://x', 'categories': []},
                 'download': {'root': '/tmp/m'},
                 'merge': {'enabled': True, 'delete_episodes': True}}
          import os; os.makedirs('/tmp/m', exist_ok=True)
          a = Archiver.__new__(Archiver)
          a.config = cfg
          conf = Archiver._merge_config(a)
          assert conf == {'enabled': True, 'delete_episodes': True,
                          'only_when_complete': False}, conf
          print('✓ 合并配置解析正常:', conf)
          PY

      - name: 验证旧数据补合并
        run: |
          docker exec hgxz-ci sh -c '
            set -e
            mkdir -p "/tmp/legacy/短剧/旧剧 [huangguo-4242]"
            for i in 1 2; do
              ffmpeg -hide_banner -loglevel error -y \
                -f lavfi -i testsrc=size=160x120:rate=10:duration=2 \
                -f lavfi -i sine=frequency=400:duration=2 \
                -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest \
                "/tmp/legacy/短剧/旧剧 [huangguo-4242]/旧剧.S01E0$i.mp4"
            done
            printf "<tvshow><title>旧剧</title><plot>老简介</plot><year>2025</year></tvshow>" \
              > "/tmp/legacy/短剧/旧剧 [huangguo-4242]/tvshow.nfo"
            python -m HGXZ.merge_existing /tmp/legacy --dry-run
            test -f "/tmp/legacy/短剧/旧剧 [huangguo-4242]/旧剧.S01E01.mp4" || { echo "dry-run 改动了文件"; exit 1; }
            python -m HGXZ.merge_existing /tmp/legacy
            test -f "/tmp/legacy/短剧/旧剧 (全2集)/旧剧 (全2集).mp4" || { echo "未生成合并文件"; exit 1; }
            test ! -f "/tmp/legacy/短剧/旧剧 [huangguo-4242]/旧剧.S01E01.mp4" || { echo "分集未删除"; exit 1; }
            test ! -f "/tmp/legacy/短剧/旧剧 (全2集).mp4" || { echo "合并文件未移入独立文件夹"; exit 1; }
            grep -q "老简介" "/tmp/legacy/短剧/旧剧 (全2集)/旧剧 (全2集).nfo" || { echo "NFO 未继承简介"; exit 1; }
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "/tmp/legacy/短剧/旧剧 (全2集)/旧剧 (全2集).mp4")
            awk -v d="$d" "BEGIN{exit !(d>3.5 && d<4.6)}" || { echo "时长异常: $d"; exit 1; }
            echo "✓ 旧数据补合并正常（时长 $d，独立文件夹）"
          '

      - name: 验证 ffmpeg 可合并视频
        run: |
          docker exec hgxz-ci sh -c '
            ffmpeg -hide_banner -loglevel error -y \
              -f lavfi -i testsrc=size=160x120:rate=10:duration=1 \
              -f lavfi -i sine=frequency=400:duration=1 \
              -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest /tmp/a.mp4
            cp /tmp/a.mp4 /tmp/b.mp4
            printf "file /tmp/a.mp4\nfile /tmp/b.mp4\n" > /tmp/list.txt
            ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i /tmp/list.txt \
              -c copy /tmp/out.mp4
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/out.mp4)
            echo "合并后时长: $d"
            awk -v d="$d" "BEGIN{exit !(d>1.5 && d<2.6)}" || { echo "时长异常"; exit 1; }
            echo "✓ ffmpeg 合并链路可用"
          '

      - name: 验证合并接口可用
        run: |
          docker exec hgxz-ci python - <<'PY'
          import sys; sys.path.insert(0, '/app')
          from pathlib import Path
          from HGXZ.merge_existing import preview_library
          # 空目录不应报错，且各计数为 0
          r = preview_library(Path('/tmp/nonexistent-xyz'))
          assert r['pending'] == 0 and r['albums'] == 0, r
          print('✓ 预览接口空目录正常:', r)
          PY
          # 页面里必须真的有这个按钮
          docker exec hgxz-ci sh -c '
            grep -q "btn-merge" /app/HGXZ/web/static/index.html || { echo "缺少合并按钮"; exit 1; }
            grep -q "merge-existing/preview" /app/HGXZ/web/static/index.html || { echo "缺少预览调用"; exit 1; }
            echo "✓ WebUI 合并按钮已就位"
          '

      - name: 验证合并不受声明集数虚高影响
        run: |
          docker exec hgxz-ci python - <<'PY'
          import sys; sys.path.insert(0, '/app')
          from pathlib import Path
          from HGXZ.state import StateDB
          db = StateDB(Path('/tmp/mergechk.sqlite3'))
          # 模拟：站点声明 14 集，但实际只成功下载 13 集（第14集是预告/未提供）
          db.upsert_album(9001, 'AI成人短剧', '测试剧', 14, True, '/tmp/x')
          for n in range(1, 14):
              db.mark_episode(9001, n, f'/tmp/x/s{n}.mp4', 'done', 100)
          ready, done, failed, pending = db.album_merge_ready(9001)
          assert ready and done == 13 and pending == 0, (ready, done, failed, pending)
          print('✓ 声明14集只下13集也判定可合并:', (ready, done, failed, pending))
          # 有一集还在 pending（无记录）则不可合并
          db2 = StateDB(Path('/tmp/mergechk2.sqlite3'))
          db2.upsert_album(9002, 'AI成人短剧', '测试剧2', 14, True, '/tmp/y')
          for n in range(1, 13):
              db2.mark_episode(9002, n, f'/tmp/y/s{n}.mp4', 'done', 100)
          ready2, *_ = db2.album_merge_ready(9002)
          assert not ready2, '有 pending 集不应合并'
          print('✓ 仍有待下载集时不合并:', ready2)
          PY

      - name: 验证合并产物每部一个独立文件夹
        run: |
          docker exec hgxz-ci python - <<'PY'
          import sys; sys.path.insert(0, '/app')
          from pathlib import Path
          from HGXZ.merge_existing import merge_library, _migrate_legacy_flat_movies
          import tempfile, subprocess, os
          root = Path('/tmp/folder-ci'); root.mkdir(parents=True, exist_ok=True)
          lib = root / 'AI成人短剧'; lib.mkdir(parents=True, exist_ok=True)
          # 造一部已下载的剧（模拟老数据）
          d = lib / '测试剧 [huangguo-1]'; sd = d / 'Season 01'; sd.mkdir(parents=True)
          for i in (1,2):
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y',
                '-f','lavfi','-i','testsrc=size=160x120:rate=10:duration=1',
                '-f','lavfi','-i','sine=frequency=400:duration=1',
                '-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p','-c:a','aac','-shortest',
                str(sd / f'测试剧.S01E0{i}.mp4')], check=True)
          merge_library(root, delete_episodes=True)
          # 应该生成：lib/测试剧 (全2集)/测试剧 (全2集).mp4
          out = lib / '测试剧 (全2集)' / '测试剧 (全2集).mp4'
          assert out.is_file(), f'合并产物未在独立文件夹: {out}'
          assert not (d / 'Season 01').exists(), '旧 Season 目录应已删除'
          print('✓ 合并产物在独立文件夹:', out)

          # 迁移：库根平铺的旧电影应移进同名文件夹
          flat = lib / '旧剧 (全1集).mp4'; flat.write_bytes(b'x')
          (lib / '旧剧 (全1集).nfo').write_text('x')
          _migrate_legacy_flat_movies(root)
          assert (lib / '旧剧 (全1集)' / '旧剧 (全1集).mp4').is_file(), '平铺电影未迁移进文件夹'
          assert not flat.exists(), '原平铺文件应已移走'
          print('✓ 旧平铺电影已迁移进同名文件夹')
          PY

      - name: 验证合并跨设备（TMPDIR 异盘）不失败
        run: |
          docker exec hgxz-ci python - <<'PY'
          import subprocess, pathlib, os
          base = pathlib.Path('/tmp/xdev/短剧/跨设备剧 [huangguo-7777]')
          (base / 'Season 01').mkdir(parents=True, exist_ok=True)
          for i in (1, 2):
              subprocess.run([
                  'ffmpeg', '-hide_banner', '-loglevel', 'error', '-y',
                  '-f', 'lavfi', '-i', 'testsrc=size=160x120:rate=10:duration=1',
                  '-f', 'lavfi', '-i', 'sine=frequency=400:duration=1',
                  '-c:v', 'libx264', '-preset', 'ultrafast', '-pix_fmt', 'yuv420p',
                  '-c:a', 'aac', '-shortest',
                  str(base / 'Season 01' / f'跨设备剧.S01E0{i}.mp4')
              ], check=True)
          pathlib.Path('/tmp/extmp').mkdir(parents=True, exist_ok=True)
          os.environ['TMPDIR'] = '/tmp/extmp'
          subprocess.run(['python', '-m', 'HGXZ.merge_existing', '/tmp/xdev'], check=True)
          out = pathlib.Path('/tmp/xdev/短剧/跨设备剧 (全2集)/跨设备剧 (全2集).mp4')
          assert out.is_file(), '跨设备合并失败'
          print('OK 跨设备合并正常:', out)
          PY

      - name: 验证 WebUI 封面接口在合并改名后仍可取
        run: |
          docker exec hgxz-ci python - <<'PY'
          import subprocess, pathlib
          from HGXZ.state import StateDB
          from HGXZ.merge_existing import merge_library
          base = pathlib.Path('/tmp/cov/短剧/封面剧 [huangguo-55]')
          (base / 'Season 01').mkdir(parents=True, exist_ok=True)
          for i in (1, 2):
              subprocess.run([
                  'ffmpeg', '-hide_banner', '-loglevel', 'error', '-y',
                  '-f', 'lavfi', '-i', 'testsrc=size=160x120:rate=10:duration=1',
                  '-f', 'lavfi', '-i', 'sine=frequency=400:duration=1',
                  '-c:v', 'libx264', '-preset', 'ultrafast', '-pix_fmt', 'yuv420p',
                  '-c:a', 'aac', '-shortest',
                  str(base / 'Season 01' / f'封面剧.S01E0{i}.mp4')
              ], check=True)
          st = StateDB(pathlib.Path('/tmp/cov/s.sqlite3'))
          st.upsert_album(55, 'AI成人短剧', '封面剧', 2, True,
                          '/tmp/cov/短剧/封面剧 [huangguo-55]')
          merge_library(pathlib.Path('/tmp/cov'), state=st)
          row = st.merge_row(55)
          assert row and row['path'], 'merges 未回填'
          poster = pathlib.Path(row['path']).parent / (pathlib.Path(row['path']).stem + '-poster.jpg')
          poster.write_bytes(b'\xff\xd8\xff\xd9')
          assert poster.is_file(), 'poster 缺失'
          print('OK poster path:', poster)
          st.close()
          PY

      - name: 验证合并后不会重复下载
        run: |
          docker exec hgxz-ci python - <<'PY'
          import subprocess, pathlib, sqlite3, os
          from HGXZ.state import StateDB
          from HGXZ.merge_existing import merge_library
          # 构造一部剧：源分集 + 完整 state
          base = pathlib.Path('/tmp/redl/短剧/重下剧 [huangguo-321]/Season 01')
          base.mkdir(parents=True, exist_ok=True)
          for i in (1,2):
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','lavfi','-i','testsrc=size=160x120:rate=10:duration=1','-f','lavfi','-i','sine=frequency=400:duration=1','-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p','-c:a','aac','-shortest',str(base/f'重下剧.S01E0{i}.mp4')], check=True)
          st = StateDB(pathlib.Path('/tmp/redl/s.sqlite3'))
          st.upsert_album(321,'AI成人短剧','重下剧',2,True,'/tmp/redl/短剧/重下剧 [huangguo-321]')
          for i in (1,2):
              st.mark_episode(321,i,str(base/f'重下剧.S01E0{i}.mp4'),'done')
          merge_library(pathlib.Path('/tmp/redl'), state=st)
          # 合并后分集应被删、episode path 指向合并电影
          assert not (base/'重下剧.S01E01.mp4').exists(), '分集未删'
          rows = st.episode_rows(321)
          assert all(Path(r['path']).exists() for r in rows), 'episode path 未指向合并文件'
          # 模拟 sync_album 的 pending 计算
          pending = [n for n in range(1,3) if not st.episode_done(321,n)]
          assert pending == [], f'合并后仍被认为待下载: {pending}'
          print('OK 合并后无重复下载风险, pending=', pending)
          st.close()
          PY

      - name: 验证已合并剧的残留分集被清理
        run: |
          docker exec hgxz-ci python - <<'PY'
          import subprocess, pathlib
          from HGXZ.state import StateDB
          from HGXZ.merge_existing import merge_library
          src = pathlib.Path('/tmp/stale/短剧/残留剧 [huangguo-88]/Season 01')
          src.mkdir(parents=True, exist_ok=True)
          for i in (1,2):
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','lavfi','-i','testsrc=size=160x120:rate=10:duration=1','-f','lavfi','-i','sine=frequency=400:duration=1','-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p','-c:a','aac','-shortest',str(src/f'残留剧.S01E0{i}.mp4')], check=True)
          movie_dir = pathlib.Path('/tmp/stale/短剧/残留剧 (全2集)'); movie_dir.mkdir(parents=True, exist_ok=True)
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','lavfi','-i','testsrc=size=160x120:rate=10:duration=2','-f','lavfi','-i','sine=frequency=400:duration=2','-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p','-c:a','aac','-shortest',str(movie_dir/'残留剧 (全2集).mp4')], check=True)
          st = StateDB(pathlib.Path('/tmp/stale/s.sqlite3'))
          st.upsert_album(88,'AI成人短剧','残留剧',2,True,'/tmp/stale/短剧/残留剧 [huangguo-88]')
          for i in (1,2):
              st.mark_episode(88,i,str(src/f'残留剧.S01E0{i}.mp4'),'done')
          merge_library(pathlib.Path('/tmp/stale'), state=st)
          assert not src.parent.exists(), '残留分集目录未清理'
          rows = st.episode_rows(88)
          assert all(pathlib.Path(r['path']).exists() for r in rows), 'episodes 未 repoint'
          pending = [n for n in range(1,3) if not st.episode_done(88,n)]
          assert pending == [], f'仍待下载: {pending}'
          print('OK 残留分集已清理且不再重复下载')
          st.close()
          PY

      - name: 验证 skip 分支不丢封面 + 补抓已合并封面
        run: |
          docker exec hgxz-ci python - <<'PY'
          import subprocess, pathlib
          from HGXZ.state import StateDB
          from HGXZ.merge_existing import merge_library
          from HGXZ.rebuild_covers import rebuild
          # 电影已存在、残留分集目录里带 poster.jpg
          src = pathlib.Path('/tmp/covskip/短剧/丢图剧 [huangguo-99]/Season 01')
          src.mkdir(parents=True, exist_ok=True)
          for i in (1,2):
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','lavfi','-i','testsrc=size=160x120:rate=10:duration=1','-f','lavfi','-i','sine=frequency=400:duration=1','-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p','-c:a','aac','-shortest',str(src/f'丢图剧.S01E0{i}.mp4')], check=True)
          movie_dir = pathlib.Path('/tmp/covskip/短剧/丢图剧 (全2集)'); movie_dir.mkdir(parents=True, exist_ok=True)
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','lavfi','-i','testsrc=size=160x120:rate=10:duration=2','-f','lavfi','-i','sine=frequency=400:duration=2','-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p','-c:a','aac','-shortest',str(movie_dir/'丢图剧 (全2集).mp4')], check=True)
          # 旧目录里有封面
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','lavfi','-i','testsrc=size=120x160:duration=1','-frames:v','1',str(src.parent/'poster.jpg')], check=True)
          st = StateDB(pathlib.Path('/tmp/covskip/s.sqlite3'))
          st.upsert_album(99,'AI成人短剧','丢图剧',2,True,'/tmp/covskip/短剧/丢图剧 [huangguo-99]')
          for i in (1,2):
              st.mark_episode(99,i,str(src/f'丢图剧.S01E0{i}.mp4'),'done')
          merge_library(pathlib.Path('/tmp/covskip'), state=st)
          rescued = movie_dir/'丢图剧 (全2集)-poster.jpg'
          assert rescued.is_file(), 'skip 清理时封面未抢救'
          print('OK skip 分支保住封面')

          # 再造一部缺封面的已合并电影，用 rebuild 补抓
          m2 = pathlib.Path('/tmp/covskip/短剧/补图剧 (全1集)'); m2.mkdir(parents=True, exist_ok=True)
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','lavfi','-i','testsrc=size=160x120:rate=10:duration=1','-f','lavfi','-i','sine=frequency=400:duration=1','-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p','-c:a','aac','-shortest',str(m2/'补图剧 (全1集).mp4')], check=True)
          st.upsert_album(100,'AI成人短剧','补图剧',1,True,'')
          st.mark_merge(100, str(m2/'补图剧 (全1集).mp4'), 1, 10)
          cover_src = pathlib.Path('/tmp/covskip/real.jpg')
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','lavfi','-i','testsrc=size=120x160:duration=1','-frames:v','1',str(cover_src)], check=True)
          class FakeClient:
              def cover_url(self, i): return 'http://x/c.jpg'
              def get_bytes(self, u): return cover_src.read_bytes()
          r = rebuild(pathlib.Path('/tmp/covskip'), FakeClient(), state=st)
          assert (m2/'补图剧 (全1集)-poster.jpg').is_file(), 'rebuild 未补抓合并封面'
          print('OK 已合并电影封面可补抓:', r)
          st.close()
          PY

      - name: 验证 merges 表缺失时封面仍可显示
        run: |
          docker exec hgxz-ci python - <<'PY'
          import subprocess, pathlib
          from HGXZ.state import StateDB
          from HGXZ.web.app import poster_candidates
          # 场景：封面只在「剧名 (全N集)/」里，旧目录已删，merges 表为空
          m = pathlib.Path('/tmp/nomerge/短剧/无记录剧 (全5集)'); m.mkdir(parents=True, exist_ok=True)
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','lavfi','-i','testsrc=size=160x120:rate=10:duration=1','-f','lavfi','-i','sine=frequency=400:duration=1','-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p','-c:a','aac','-shortest',str(m/'无记录剧 (全5集).mp4')], check=True)
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','lavfi','-i','testsrc=size=120x160:duration=1','-frames:v','1',str(m/'无记录剧 (全5集)-poster.jpg')], check=True)
          st = StateDB(pathlib.Path('/tmp/nomerge/s.sqlite3'))
          st.upsert_album(777,'AI成人短剧','无记录剧',5,True,'/tmp/nomerge/短剧/无记录剧 [huangguo-777]')
          assert st.merge_row(777) is None, 'merges 表应为空'
          cands = poster_candidates(st, 777)
          hit = [c for c in cands if c.is_file() and c.stat().st_size > 0]
          assert hit, f'未找到封面候选: {cands}'
          assert '无记录剧 (全5集)-poster.jpg' in str(hit[0]), f'命中路径不对: {hit[0]}'
          print('OK merges 缺失时封面可定位:', hit[0])
