name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 语法与配置校验
  lint:
    name: 语法与配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Node 语法检查
        run: |
          node --check server.js
          node --check lib/download.js
          node --check scripts/check.js
          node --check worker/index.js
          echo "✓ 所有 JS 语法通过"

      - name: 校验 package.json
        run: node -e "const p=require('./package.json');if(!p.scripts.start)throw Error('缺少 start');console.log('✓ package.json 正常')"

      - name: 校验 docker-compose.yml
        run: |
          docker compose config >/dev/null
          echo "✓ docker-compose.yml 语法通过"

      - name: 校验 nginx 配置
        run: |
          docker run --rm \
            -v "$PWD/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
          echo "✓ nginx.conf 语法通过"

  # ---------------------------------------------------------------- 接口冒烟测试
  smoke:
    name: 接口冒烟测试
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 启动服务
        run: |
          SERVE_STATIC=1 PORT=7732 node server.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:7732/healthz >/dev/null; then
              echo "✓ 服务已就绪"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:7732/healthz

      - name: 运行自检
        run: node scripts/check.js http://127.0.0.1:7732

      - name: 失败时输出日志
        if: failure()
        run: cat /tmp/server.log

  # ---------------------------------------------------------------- 镜像构建
  build:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: huangguo-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: 构建前端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          tags: huangguo-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: 启动整套 compose 并验证
        run: |
          docker compose up -d --build
          # 等两个容器都 healthy
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:7731/healthz >/dev/null 2>&1; then
              echo "✓ 前端 7731 就绪"
              break
            fi
            sleep 2
          done
          echo "--- 容器状态 ---"
          docker compose ps
          echo "--- 经 nginx 访问 API ---"
          curl -sf http://127.0.0.1:7731/api/ | head -c 200
          echo
          echo "--- 静态页 ---"
          curl -sf -o /dev/null -w "index: %{http_code}\n" http://127.0.0.1:7731/
          curl -sf -o /dev/null -w "play:  %{http_code}\n" http://127.0.0.1:7731/play.html

      - name: 失败时输出容器日志
        if: failure()
        run: docker compose logs --tail=100

      - name: 清理
        if: always()
        run: docker compose down -v || true
