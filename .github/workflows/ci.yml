name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR 仓库名必须小写；github.repository 的大小写不保证
  IMAGE: ghcr.io/mogvl/huangguo-down

jobs:
  # ---------------------------------------------------------------- 静态校验
  lint:
    name: 语法与配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Python 语法检查
        run: |
          python -m compileall -q HGXZ
          echo "✓ 所有 Python 文件语法通过"

      - name: Shell 脚本检查
        run: |
          sh -n docker/entrypoint.sh
          bash -n deploy.sh
          echo "✓ Shell 脚本语法通过"

      - name: 校验 docker-compose.yml
        run: |
          docker compose config >/dev/null
          echo "✓ docker-compose.yml 语法通过"

      - name: 校验 config.example.json
        run: |
          python -c "import json;json.load(open('config.example.json'));print('✓ config.example.json 是合法 JSON')"

      - name: 校验前端引用的元素 id 都存在
        run: |
          python - <<'PY'
          import re, sys
          html = open('HGXZ/web/static/index.html', encoding='utf-8').read()
          ids = set(re.findall(r'id="([^"]+)"', html))
          used = set(re.findall(r"getElementById\('([^']+)'\)", html))
          missing = sorted(used - ids)
          if missing:
              print('缺失的元素 id:', missing)
              sys.exit(1)
          print(f'✓ {len(used)} 个 getElementById 引用全部存在')
          PY

  # ---------------------------------------------------------------- 启动冒烟
  smoke:
    name: 容器启动冒烟测试
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t hgxz:ci .

      - name: 启动容器
        run: |
          docker run -d --name hgxz-ci \
            -p 7731:7731 -p 7732:7732 \
            -e HGXZ_SYNC_ON_START=0 \
            -e TZ=Asia/Shanghai \
            -e UMASK=000 \
            hgxz:ci
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:7731/healthz >/dev/null 2>&1; then
              echo "✓ 前端在 ${i}s 后就绪"; break
            fi
            sleep 1
            [ "$i" = 30 ] && { echo "前端未在 30s 内就绪"; docker logs hgxz-ci; exit 1; }
          done

      - name: 验证前端端口
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7731/)
          [ "$code" = "200" ] || { echo "前端返回 $code"; exit 1; }
          echo "✓ 7731 返回 200"

      - name: 验证后端端口
        run: |
          body=$(curl -fsS http://127.0.0.1:7732/healthz)
          echo "$body" | grep -q '"status":"ok"' || { echo "后端响应异常: $body"; exit 1; }
          echo "✓ 7732 /healthz 正常：$body"

      - name: 验证后端不带页面
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7732/)
          [ "$code" = "404" ] || { echo "后端 / 返回 $code，预期 404"; exit 1; }
          echo "✓ 7732 不提供页面（404）"

      - name: 验证 API 可用
        run: |
          curl -fsS http://127.0.0.1:7732/api/dashboard | grep -q '"albums"' || exit 1
          echo "✓ /api/dashboard 正常"

      - name: 验证容器日志无异常
        run: |
          docker logs hgxz-ci 2>&1 | tee /tmp/ci.log
          grep -qiE 'traceback|error|critical' /tmp/ci.log && {
            echo "日志中出现异常"; exit 1; }
          echo "✓ 日志干净"

      - name: 清理
        if: always()
        run: docker rm -f hgxz-ci || true

  # ---------------------------------------------------------------- 发布镜像
  publish:
    name: 推送 GHCR 镜像
    runs-on: ubuntu-latest
    needs: smoke
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 清理旧的无标签版本
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: 'huangguo-down'
          package-type: 'container'
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 3
