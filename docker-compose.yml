# 黄果下载 · 一键部署（只用预构建镜像，不需要源码）
#
#   docker compose up -d
#
# 想从源码构建，叠加构建覆盖文件：
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# 或者直接跑 ./deploy.sh（会自动判断）
services:
  hgxz:
    # CI 自动推送的多架构镜像（amd64 / arm64）
    image: ghcr.io/mogvl/huangguo-down:latest
    container_name: huangguo-down
    restart: unless-stopped

    ports:
      # 前端 WebUI
      - "7731:7731"
      # 后端 API（只跑接口，无页面）。不需要外部直连就整段注释掉
      - "7732:7732"

    environment:
      TZ: Asia/Shanghai
      # 每日自动同步时间（HH:MM，24 小时制）
      SCHEDULE: "03:30"
      # 启动时是否立刻同步一次。默认 0：打开网页不会突然开始下载，
      # 想立刻下载就点「立即同步」，或到定时点自动跑
      HGXZ_SYNC_ON_START: "0"
      # 前端 / 后端端口
      HGXZ_PORT: "7731"
      HGXZ_API_PORT: "7732"
      # NAS 共享目录需要宽松权限，否则 Emby/Jellyfin 读不到文件
      UMASK: "000"
      # 合并：把整部短剧的所有集拼成一个 mp4，当作电影交给 Emby
      # enabled=1 打开；delete_episodes=1 合并后删除分集（省空间）
      HGXZ_MERGE: "1"
      HGXZ_MERGE_DELETE: "1"
      # 设为 1 则只在剧集完结后才合并，连载中不合并
      HGXZ_MERGE_ONLY_WHEN_COMPLETE: "0"
      # 可选：WebUI 共享口令，留空则不鉴权（仅建议内网使用）
      HGXZ_WEB_TOKEN: ""
      # 可选：站点需要代理时取消注释，改成局域网里的真实代理地址
      # HTTP_PROXY: "http://192.168.1.10:7890"
      # HTTPS_PROXY: "http://192.168.1.10:7890"
      # NO_PROXY: "127.0.0.1,localhost"

    volumes:
      # ↓↓↓ 把下面四个宿主机路径改成你 NAS 上的真实路径 ↓↓↓
      # 目录不存在时 Docker 会自动创建，但属主是 root，建议先手动 mkdir
      - /volume1/docker/huangguo-down/config:/config
      - /volume1/docker/huangguo-down/data:/data
      - /volume1/docker/huangguo-down/logs:/logs
      - /volume1/media/黄果:/media

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7731/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
