server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 静态资源压缩（hls.min.js 有 400KB，压缩后约 100KB）
    gzip              on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/vnd.apple.mpegurl image/svg+xml;

    # 不暴露 nginx 版本
    server_tokens off;

    # 后端地址用**变量**形式，配合 Docker 内置 DNS 动态解析。
    #
    # 两个坑，都已实测：
    # 1) 变量形式的 proxy_pass 必须显式配 resolver，否则报
    #    「no resolver defined to resolve api」直接 502。
    # 2) 不能用 upstream 块 + `server api:7732` —— nginx 只在启动时解析一次，
    #    容器重启换了 IP 后会永久 502。127.0.0.11 是 Docker 内置 DNS，
    #    valid=10s 让它每 10 秒重新解析，容器重建后自动跟上。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://api:7732;



    # ------------------------------------------------ API 反向代理
    # 前端与 API 同源（都走 7731），因此前端无需任何跨域配置。

    location /api/ {
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;  # 必须带端口
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    # /api 本身（不带斜杠）
    location = /api {
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;  # 必须带端口
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # 封面解密代理
    location /media {
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host            $http_host;  # 必须带端口
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # HLS 分片 / 密钥 / m3u8 重写代理。
    # 分片体积大（单集 100MB+），关闭请求体缓冲、放宽超时。
    location /raw {
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host            $http_host;  # 必须带端口
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 整集下载：单集动辄 100~200MB，必须关缓冲并放宽超时，
    # 否则 nginx 会先落盘到临时文件、且默认 60s 就会断开。
    location /download {
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host            $http_host;  # 必须带端口
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering    off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        # 让浏览器能读到文件名
        proxy_pass_header  Content-Disposition;
        proxy_max_temp_file_size 0;
    }

    location /healthz {
        proxy_pass       $backend;
        access_log       off;
    }

    # ------------------------------------------------ 静态页
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # hls.js 体积大且版本固定，长缓存
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # 隐藏文件与源码，避免被直接下载
    location ~ /\. {
        deny all;
    }
}
